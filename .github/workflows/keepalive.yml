name: Supabase keep-alive
on:
  schedule:
    - cron: '17 6 * * 1,4' # lunes y jueves (UTC)
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Llamar a ping() (escritura real en la BD)
        run: |
          URL=$(sed -n "s/.*SUPABASE_URL = '\(.*\)'.*/\1/p" src/supabaseConfig.ts)
          KEY=$(sed -n "s/.*SUPABASE_ANON_KEY = '\(.*\)'.*/\1/p" src/supabaseConfig.ts)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Supabase no configurado todavía"; exit 0; fi
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
